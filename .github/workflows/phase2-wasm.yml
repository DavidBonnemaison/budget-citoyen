# Phase 2 — Simulation Engines CI
#
# Validates all Phase 2 simulation engines (core Rust, Python scenario
# pre-compute, TypeScript engines) for correctness, safety, and integration
# readiness before they can be consumed by Phase 3 (Interactive Simulation Shell).
#
# Architecture (Plan 02-11 — simplified hybrid):
#   - Python scenario pre-compute runs openfisca-france in CI and exports
#     static scenario-v2025.1.json (replaces codegen/WASM formula engine)
#   - TypeScript engines (scenario-cache.ts, macro-interpolate.ts) run vitest
#     tests — zero WASM dependencies, pure TS computation
#   - Core Rust crate (budget-citoyen-core) keeps parameter/profile types,
#     cargo test validates structural contracts
#   - No wasm-pack, no wasm-bindgen, no WASM boundary layers — all removed
#     per Plan 02-09/02-10/02-11 architecture simplification
#
# Gates (all must pass):
#   1. Phase 1 artifact existence (D-04)
#   2. Cargo fmt (style consistency)
#   3. Cargo clippy with -D warnings (lint enforcement)
#   4. Core crate tests (cargo test -p budget-citoyen-core)
#   5. Scenario pre-compute (Python openfisca-france pipeline)
#   6. TypeScript engine tests (vitest in webapp/)
#   7. Version consistency gates + OpenFisca staleness check (soft warning)
#   8. CI summary gate — all required jobs must pass

name: Phase 2 — Simulation Engines CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  RUST_VERSION: '1.85'
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '22'

jobs:
  # ── Phase 1 Gate (D-04) ──────────────────────────────────────────────
  phase1-gate:
    name: Phase 1 Artifact Existence Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Phase 1 artifacts exist
        run: |
          echo "Checking Phase 1 artifact existence (D-04)..."
          FAILED=0

          # Tax rules: at least 31 YAML parameter files
          YAML_COUNT=$(find packages/tax-rules/parameters/ -name "*.yaml" 2>/dev/null | wc -l)
          if [ "$YAML_COUNT" -lt 31 ]; then
            echo "::error file=packages/tax-rules/parameters/,line=1::Phase 1 gate FAILED: Found $YAML_COUNT YAML parameter files (need >= 31)"
            FAILED=1
          else
            echo "PASSED: $YAML_COUNT YAML parameter files found"
          fi

          # Bilingual test fixtures
          if [ ! -f packages/data-pipeline/dist/bilingual_test_fixtures.json ]; then
            echo "::error file=packages/data-pipeline/dist/,line=1::Phase 1 gate FAILED: bilingual_test_fixtures.json missing"
            FAILED=1
          else
            echo "PASSED: bilingual_test_fixtures.json exists"
          fi

          # Synthetic population
          if [ ! -f packages/data-pipeline/dist/population-v2025.1.json ]; then
            echo "::warning file=packages/data-pipeline/dist/,line=1::Phase 1: population-v2025.1.json not found (may be generated artifact)"
          else
            echo "PASSED: population-v2025.1.json exists"
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Phase 1 gate FAILED — required artifacts missing. Run Phase 1 pipeline first."
            exit 1
          fi
          echo "Phase 1 gate PASSED — all required artifacts present"

  # ── Rust Setup ──────────────────────────────────────────────────────
  rust-setup:
    name: Rust Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          override: true

      - name: Verify installation
        run: |
          rustc --version
          cargo --version
          echo "Rust toolchain ${{ env.RUST_VERSION }} ready"

  # ── Format Check ────────────────────────────────────────────────────
  cargo-fmt:
    name: Cargo Format Check
    runs-on: ubuntu-latest
    needs: [rust-setup]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          override: true

      - name: Run cargo fmt check
        run: cargo fmt --all -- --check

  # ── Clippy Lint ────────────────────────────────────────────────────
  cargo-clippy:
    name: Cargo Clippy (strict)
    runs-on: ubuntu-latest
    needs: [rust-setup]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          override: true

      - name: Run cargo clippy
        run: cargo clippy --workspace -- -D warnings

  # ── Core Crate Tests (native) ───────────────────────────────────────
  cargo-test-core:
    name: Core Crate Tests (native)
    runs-on: ubuntu-latest
    needs: [rust-setup]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          override: true

      - name: Run cargo test (core)
        run: cargo test -p budget-citoyen-core

  # ── Scenario Pre-Compute (Python) ───────────────────────────────────
  scenario-precompute:
    name: Scenario Pre-Compute Pipeline
    runs-on: ubuntu-latest
    needs: [phase1-gate]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: packages/data-pipeline/pyproject.toml

      - name: Install Python dependencies
        working-directory: packages/data-pipeline
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run scenario pre-compute
        working-directory: packages/data-pipeline
        run: |
          PYTHONPATH=src python -m scenarios.precompute
          echo "Scenario pre-compute complete"

      - name: Verify scenario output
        run: |
          OUTPUT="packages/data-pipeline/dist/scenarios-v2025.1.json"
          if [ ! -f "$OUTPUT" ]; then
            echo "::error file=packages/data-pipeline/dist/,line=1::Scenario pre-compute FAILED: $OUTPUT not generated"
            exit 1
          fi

          SCENARIO_COUNT=$(python3 -c "import json; d=json.load(open('$OUTPUT')); print(len(d['scenarios']))")
          if [ "$SCENARIO_COUNT" -lt 12 ]; then
            echo "::error file=$OUTPUT,line=1::Scenario pre-compute FAILED: only $SCENARIO_COUNT scenarios (need >= 12)"
            exit 1
          fi
          echo "PASSED: $SCENARIO_COUNT scenarios pre-computed"

          # Check file size < 1MB (uncompressed)
          SIZE=$(stat -f%z "$OUTPUT" 2>/dev/null || stat -c%s "$OUTPUT" 2>/dev/null)
          echo "Scenario file size: ${SIZE} bytes"
          if [ "$SIZE" -gt 1048576 ]; then
            echo "::warning file=$OUTPUT,line=1::Scenario file exceeds 1MB — consider compression"
          fi

      - name: Validate scenarios JSON Schema
        run: |
          SCHEMA="packages/data-pipeline/src/scenarios/schemas/scenarios.schema.json"
          OUTPUT="packages/data-pipeline/dist/scenarios-v2025.1.json"
          python3 -c "
import json, sys
from jsonschema import Draft202012Validator, ValidationError

with open('$SCHEMA') as f:
    schema = json.load(f)
with open('$OUTPUT') as f:
    doc = json.load(f)

validator = Draft202012Validator(schema)
errors = list(validator.iter_errors(doc))

if errors:
    for e in errors:
        print(f'SCHEMA ERROR: {e.message} at path {\" → \".join(str(p) for p in e.absolute_path) if e.absolute_path else \"root\"}', file=sys.stderr)
    sys.exit(1)
print(f'PASSED: scenarios JSON validates against schema ({len(doc[\"scenarios\"])} scenarios, {len(doc[\"scenarios\"][0][\"results\"])} profiles)')
"

      - name: Verify openfisca-france version consistency
        run: |
          OF_VERSION=$(python3 -c "import importlib.metadata; print(importlib.metadata.version('openfisca-france'))")
          echo "openfisca-france version: $OF_VERSION"
          # Check version is within expected range (>=159,<200)
          MAJOR=$(echo "$OF_VERSION" | cut -d. -f1)
          MINOR=$(echo "$OF_VERSION" | cut -d. -f2)
          if [ "$MAJOR" -lt 159 ] || [ "$MAJOR" -ge 200 ]; then
            echo "::warning file=packages/data-pipeline/pyproject.toml,line=19::openfisca-france version $OF_VERSION is outside expected range 159-199"
          fi

  # ── TypeScript Engine Tests (vitest) ────────────────────────────────
  typescript-tests:
    name: TypeScript Engine Tests (vitest)
    runs-on: ubuntu-latest
    needs: [scenario-precompute]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install npm dependencies
        working-directory: webapp
        run: npm ci

      - name: Run vitest
        working-directory: webapp
        run: npx vitest run --reporter=verbose

  # ── Version Gates & Staleness ───────────────────────────────────────
  version-check:
    name: Version Gates & Staleness
    runs-on: ubuntu-latest
    needs: [rust-setup]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          override: true

      - name: Verify reference year (2025) in Rust source
        run: |
          echo "Checking reference year constants in Rust source..."
          YEAR_COUNT=$(grep -r "2025" packages/core/ 2>/dev/null | grep -c "reference_year\|REFERENCE_YEAR" || true)
          if [ "$YEAR_COUNT" -lt 1 ]; then
            echo "::error file=packages/core/src/,line=1::VERSION GATE FAILED: No reference_year = 2025 constant found in Rust source"
            exit 1
          fi
          echo "PASSED: Found $YEAR_COUNT reference year (2025) source references"

      - name: Verify artifact version tags (v2025.1)
        run: |
          echo "Checking semantic version tags (v2025.1)..."
          VPAT_COUNT=$(grep -r "v2025\.1" packages/ webapp/ 2>/dev/null \
            | grep -v "target/" \
            | grep -v ".venv/" \
            | grep -v "node_modules/" \
            | wc -l)
          if [ "$VPAT_COUNT" -lt 2 ]; then
            echo "::error file=packages/,line=1::VERSION GATE FAILED: Missing v2025.1 version tag references (found $VPAT_COUNT, need >= 2)"
            exit 1
          fi
          echo "PASSED: Found $VPAT_COUNT v2025.1 version tag references"

  # ── Final Gate ──────────────────────────────────────────────────────
  ci-summary:
    name: CI Gate Summary
    runs-on: ubuntu-latest
    needs:
      [phase1-gate, cargo-fmt, cargo-clippy, cargo-test-core,
       scenario-precompute, typescript-tests, version-check]
    if: always()
    steps:
      - name: Check all required jobs
        run: |
          echo "## Phase 2 CI Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| phase1-gate | ${{ needs.phase1-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| cargo-fmt | ${{ needs.cargo-fmt.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| cargo-clippy | ${{ needs.cargo-clippy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| cargo-test-core | ${{ needs.cargo-test-core.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| scenario-precompute | ${{ needs.scenario-precompute.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| typescript-tests | ${{ needs.typescript-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| version-check | ${{ needs.version-check.result }} |" >> $GITHUB_STEP_SUMMARY

          FAILED=0
          for job in phase1-gate cargo-fmt cargo-clippy cargo-test-core \
                     scenario-precompute typescript-tests version-check; do
            result="${{ needs[${job}].result }}"
            if [[ "$result" == "failure" ]] || [[ "$result" == "cancelled" ]]; then
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Phase 2 CI gate FAILED — check job results above"
            exit 1
          fi
          echo "Phase 2 CI gate PASSED — all engines validated"
