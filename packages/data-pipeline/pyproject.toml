[project]
name = "budget-citoyen-data-pipeline"
version = "0.1.0"
description = "Offline data pipeline for Budget Citoyen — tax rules, synthetic population, shock matrix"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }

dependencies = [
    "pyyaml>=6.0,<7.0",
    "jsonschema==4.25.1",
    "sdv==1.36.1",
    "opendp==0.14.2",
    "sdmetrics>=0.21,<2.0",
    "pyarrow==24.0.0",
    "numpy>=2.0,<3.0",
    "scipy>=1.14,<2.0",
    "pandas>=2.2,<3.0",
    "openfisca-france>=159,<200",
    "matplotlib>=3.9,<4.0",
    "seaborn>=0.13,<0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "matplotlib>=3.9,<4.0",
    "seaborn>=0.13,<0.14",
]

[project.scripts]
validate-data = "yaml2json.validate:validate_file"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
