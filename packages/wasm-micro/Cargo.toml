[package]
name = "budget-citoyen-wasm-micro"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
budget-citoyen-core = { path = "../core" }
wasm-bindgen = "0.2.121"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3.71"
